# Vol Wiki — GitHub Pages site config.
# Build: mkdocs build --strict (from repo root, config picked up via
# .github/workflows/deploy-wiki-pages.yml).

site_name: Vol Wiki
site_url: https://bestnathan.github.io/vol/
repo_url: https://github.com/BestNathan/vol

# Content lives in docs/wiki; this config dir (.github/pages) is kept out of
# docs/ so the wiki stays pure content (wiki-ingest / Lark mirror unaffected).
docs_dir: ../../docs/wiki

# Dead [[wiki-links]] and broken markdown links fail the build.
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  # Resolves [[page]] / [[page|alias]] / [[page#heading]] across the whole
  # wiki tree (cross-directory), the wiki's native link syntax.
  - roamlinks
  # Glob-based nav: new pages appear automatically, no nav maintenance.
  - literate-nav:
      nav_file: NAV.md
  - search
  # Adds page-level AI handoff actions: copy Markdown, copy/view the raw
  # Markdown URL, and open the current page in ChatGPT or Claude.
  - copy-to-llm:
      # docs_dir is docs/wiki while Pages is hosted below /vol. Both values
      # are required so every rendered route maps to its canonical source.
      repo_url: https://raw.githubusercontent.com/BestNathan/vol/main/docs/wiki
      base_path: /vol
      minify: true
      analytics: false
      buttons:
        copy_page: true
        copy_markdown_link: true
        view_as_markdown: true
        open_in_chatgpt: true
        open_in_claude: true

markdown_extensions:
  # Consumes the YAML frontmatter (type/category/tags/...) so it doesn't
  # render as raw text at the top of every page.
  - meta
  - toc:
      permalink: true
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
