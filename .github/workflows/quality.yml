# Quality gates — run on PRs and pushes to main.
# Each job only triggers when its directory actually changed.
#
#   quality-rust     — crates/** changed  → fmt, clippy, tests, boundaries
#   quality-frontend — frontend/** changed → tsc, vitest
#   coverage         — crates/** changed  → llvm-cov ≥ 80%

name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  RUSTFLAGS: ""
  CARGO_INCREMENTAL: "1"

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Detect which paths changed ──────────────────────────────────────────
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - '.cargo/config.toml'
              - 'justfile'
              - '.config/nextest.toml'
              - 'scripts/**'
            frontend:
              - 'frontend/**'

  # ── Rust quality gate ───────────────────────────────────────────────────
  quality-rust:
    name: quality-rust
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: "."
          cache-all-crates: "true"

      - name: Remove rsproxy mirror (CI can't access rsproxy.cn)
        run: rm -f .cargo/config.toml

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Format check
        run: just fmt-check

      - name: Clippy (deny warnings)
        run: just clippy-strict

      - name: Check no doc tests
        run: just no-doc-tests

      - name: Check no clippy allow annotations
        run: just no-clippy-allow

      - name: Run all tests
        run: just test

      - name: Check agent boundaries
        run: ./scripts/check-agent-boundaries.sh

  # ── Frontend quality gate ───────────────────────────────────────────────
  quality-frontend:
    name: quality-frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript type check
        run: npx tsc -b
        working-directory: frontend

      - name: Vitest
        run: npx vitest run
        working-directory: frontend

  # ── Rust coverage gate ──────────────────────────────────────────────────
  coverage:
    name: coverage
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: "."
          cache-all-crates: "true"
          components: "llvm-tools-preview"

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage (core LLM crates, threshold ≥ 80%)
        run: |
          PKG="vol-agent-server vol-llm-agent-protocol vol-llm-runtime vol-llm-sandbox vol-llm-task vol-session vol-llm-agent vol-llm-provider vol-llm-tool vol-llm-skill vol-llm-mcp"
          cargo llvm-cov $(for p in $PKG; do echo "--package $p"; done) --summary-only 2>&1 | tee /tmp/cov-output.txt
          LINE_COV=$(grep '^TOTAL' /tmp/cov-output.txt | awk '{print $4}' | tr -d '%')
          if [ -z "${LINE_COV}" ]; then
            echo "FAIL: could not determine coverage (missing TOTAL line)"
            exit 1
          fi
          echo ""
          echo "--- Threshold check ---"
          echo "Line coverage: ${LINE_COV}% (required ≥ 80%)"
          if [ "$(echo "${LINE_COV} < 80" | bc 2>/dev/null)" = "1" ]; then
            echo "FAIL: line coverage ${LINE_COV}% is below 80%"
            exit 1
          fi
          echo "PASS: line coverage ${LINE_COV}% ≥ 80%"
