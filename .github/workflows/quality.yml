# Quality gates — run on PRs and pushes to main.
# Each job only triggers when its directory actually changed.
#
#   quality-rust       — crates/** changed  → fmt, clippy, unit, integration, boundaries (GATE)
#   quality-frontend   — frontend/** changed → tsc, vitest unit + integration (GATE)
#   coverage           — crates/** changed  → llvm-cov summary (report only, no gate)
#   coverage-frontend  — frontend/** changed → vitest coverage (report only, no gate)
#
# E2E tests (Rust `#[ignore = "e2e"]` + frontend Playwright) live in e2e.yml
# (manual workflow_dispatch) and never run here.
#
# Every step that runs project logic is a `just` recipe; scripts live in
# scripts/. Inline commands here are limited to environment setup (e.g.
# removing the rsproxy mirror that CI cannot reach).

name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  RUSTFLAGS: ""
  CARGO_INCREMENTAL: "1"

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Detect which paths changed ──────────────────────────────────────────
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - '.cargo/config.toml'
              - 'justfile'
              - '.config/nextest.toml'
              - 'scripts/**'
            frontend:
              - 'frontend/**'

  # ── Rust quality gate ───────────────────────────────────────────────────
  # fmt + clippy + unit + integration + boundaries. Failing any of these
  # blocks the PR.
  quality-rust:
    name: quality-rust
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: "."
          cache-all-crates: "true"

      - name: Remove rsproxy mirror (CI can't access rsproxy.cn)
        run: rm -f .cargo/config.toml

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Format check
        run: just fmt-check

      - name: Clippy (deny warnings)
        run: just clippy-strict

      - name: Check no doc tests
        run: just no-doc-tests

      - name: Check no clippy allow annotations
        run: just no-clippy-allow

      - name: Run unit tests
        run: just test-unit

      - name: Run integration tests
        run: just test-integration

      - name: Check agent boundaries
        run: just boundaries

  # ── Frontend quality gate ───────────────────────────────────────────────
  # tsc + vitest unit + vitest integration. Failing any of these blocks the
  # PR. Playwright e2e runs in e2e.yml only.
  quality-frontend:
    name: quality-frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: just fe-install

      - name: TypeScript type check
        run: just fe-type

      - name: Vitest unit (tests/unit, node)
        run: just fe-test-unit

      - name: Vitest integration (tests/integration, jsdom)
        run: just fe-test-integration

  # ── Rust coverage report (no gate) ──────────────────────────────────────
  coverage:
    name: coverage
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: "."
          cache-all-crates: "true"
          components: "llvm-tools-preview"

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage summary (core LLM crates, report only)
        run: just cover-ci

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-summary
          path: target/coverage-summary.txt
          retention-days: 7

  # ── Frontend coverage report (no gate) ──────────────────────────────────
  coverage-frontend:
    name: coverage-frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: just fe-install

      - name: Vitest coverage (report only)
        run: just fe-test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7
