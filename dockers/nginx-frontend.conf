# vol-llm-ui nginx configuration
# =============================================================================
# Serves React SPA static files and proxies WebSocket connections
# to the agent-server backend.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket proxy to agent-server-dingtalk backend
    location /ws {
        proxy_pass http://agent-server-dingtalk.vol-agent-system.svc.cluster.local:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Cache content-hashed assets (Vite uses base62 hashes like index-C9k0dYtX.js)
    location ~* "[-_][0-9a-zA-Z]{8,}\.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache for index.html (SPA entry point) — aggressively prevent
    # all caching so every deploy is picked up immediately.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
