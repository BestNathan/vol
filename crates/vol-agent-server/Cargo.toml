[package]
name = "vol-agent-server"
version.workspace = true
edition.workspace = true


[[bin]]
name = "vol-agent-server"
path = "src/main.rs"

[lints]
workspace = true

[features]
test-utils = []

[dependencies]
base64 = "0.22"
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }
futures-util = "0.3"
uuid = { version = "1.6", features = ["v4"] }
vol-llm-agent = { path = "../vol-llm-agent" }
vol-llm-agent-protocol = { path = "../vol-llm-agent-protocol" }
vol-llm-core = { path = "../vol-llm-core" }
vol-llm-mcp = { workspace = true }
vol-llm-provider = { path = "../vol-llm-provider" }
vol-llm-runtime = { path = "../vol-llm-runtime" }
vol-llm-sandbox = { workspace = true }
vol-llm-skill = { path = "../vol-llm-skill" }
vol-llm-task = { path = "../vol-llm-task" }
vol-llm-tool = { path = "../vol-llm-tool" }
vol-session = { path = "../vol-session" }
vol-observability = { path = "../vol-observability" }
tower-http = { workspace = true }

[dev-dependencies]
futures = "0.3"
tempfile = "3"
tokio-tungstenite = { workspace = true }
vol-llm-runtime = { path = "../vol-llm-runtime", features = ["test-utils"] }
vol-session = { path = "../vol-session" }
vol-llm-tools-builtin-glob = { path = "../vol-llm-tools-builtin/glob-tool" }
vol-llm-tools-builtin-read = { path = "../vol-llm-tools-builtin/read-tool" }

# Integration tests that exercise DataPlaneServerCore::for_test() (which is
# gated behind test-utils) — run with: cargo test -p vol-agent-server --features test-utils
[[test]]
name = "agent_server_agent_flow_test"
path = "tests/agent_server_agent_flow_test.rs"
required-features = ["test-utils"]

[[test]]
name = "jsonrpc_operation_coverage_test"
path = "tests/jsonrpc_operation_coverage_test.rs"
required-features = ["test-utils"]

[[test]]
name = "server_core_dispatch_test"
path = "tests/server_core_dispatch_test.rs"
required-features = ["test-utils"]

[[test]]
name = "server_core_non_agent_domains_test"
path = "tests/server_core_non_agent_domains_test.rs"
required-features = ["test-utils"]

[[test]]
name = "ws_transport_core_test"
path = "tests/ws_transport_core_test.rs"
required-features = ["test-utils"]
