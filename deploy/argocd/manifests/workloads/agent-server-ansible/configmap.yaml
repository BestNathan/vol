apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-server-ansible-config
  namespace: vol-agent-system
  labels:
    app.kubernetes.io/name: agent-server-ansible
    app.kubernetes.io/part-of: vol-agent
data:
  agent-server.toml: '[server]

    host = "0.0.0.0"

    port = 3003


    [server.roles]

    control_plane = false

    data_plane = true


    [data_plane]

    node_id = "ansible"

    name = "ansible-agent"

    # Register with control-plane if available

    control_url = "ws://agent-server.vol-agent-system.svc.cluster.local:3001/control/v1/ws"

    heartbeat_secs = 15

    snapshot_on_connect = true


    [runtime]

    working_dir = "/app"

    store_dir = "/app/data"


    [tracing]

    level = "info"

    format = "json"


    [opentelemetry]

    enabled = true

    endpoint = "http://otel-collector.observability.svc.cluster.local:4317"

    service_name = "agent-server-ansible"

    service_namespace = "vol-agent"

    deployment_environment = "production"

    sample_rate = 1.0

    '
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-definitions-ansible
  namespace: vol-agent-system
  labels:
    app.kubernetes.io/name: agent-definitions-ansible
    app.kubernetes.io/part-of: vol-agent
data:
  ansible.md: "---\nname: ansible\ntype: general-purpose\ndescription: Ansible automation\
    \ agent — run playbooks, ad-hoc commands, manage roles on ansible-prod sandbox\
    \ (192.168.2.106:/opt/ansible)\ntools: []\nmcps: [cli-tools-mcp]\nmax_iterations:\
    \ 30\ntool_config:\n  bash:\n    sandbox: ansible-prod\n---\n\n# Ansible Automation\
    \ Agent\n\nYou are an Ansible automation specialist. Your commands execute on\
    \ the\n**ansible-prod** control node: `192.168.2.106:/opt/ansible` via SSH sandbox.\n\
    \n## Available Capabilities\n\n### Ansible CLI (via `ansible` MCP tool)\nUses\
    \ the ansible-prod SSH sandbox with `cwd=/opt/ansible` and `ANSIBLE_CONFIG=/opt/ansible/ansible.cfg`.\n\
    \n### Bash (direct SSH to ansible-prod)\nFor inspecting files, checking inventory,\
    \ reading logs, and other shell operations\ndirectly on the ansible control node.\n\
    \n### File Operations\n`read_file`, `write_file`, `glob`, `grep` — operate on\
    \ the ansible-prod sandbox filesystem.\n\n## Inventory\nLocated at `/opt/ansible/inventories/production/hosts.yml`:\n\
    - `localhost` — local connection\n- `target-host` — `192.168.2.106`, user `root`\n\
    - Groups: `webservers` (target-host), `dev` (localhost)\n\n## Best Practices\n\
    \n1. **Check first**: Always `--check --diff` before applying changes\n2. **Limit\
    \ scope**: Use `--limit` to target specific hosts\n3. **Explain before acting**:\
    \ Tell the user what the command will do\n4. **Inventory first**: Use `ansible\
    \ all -m ping` to verify connectivity\n5. **Use bash for exploration**: Check\
    \ existing playbooks before writing new ones\n\n## Workflow\n1. Understand what\
    \ the user wants to accomplish\n2. Explore inventory and existing playbooks using\
    \ bash/file tools\n3. Show the planned command with explanation\n4. Dry-run with\
    \ `--check --diff` for destructive changes\n5. Execute and report results clearly\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-config-ansible
  namespace: vol-agent-system
  labels:
    app.kubernetes.io/name: mcp-config-ansible
    app.kubernetes.io/part-of: vol-agent
data:
  mcp.json: "{\n  \"mcpServers\": {\n    \"cli-tools-mcp\": {\n      \"type\": \"\
    http\",\n      \"url\": \"http://cli-tools-mcp.vol-agent-system.svc.cluster.local:8080/mcp\"\
    \n    }\n  }\n}\n"
