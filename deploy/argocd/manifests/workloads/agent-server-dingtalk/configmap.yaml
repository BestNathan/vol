apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-server-dingtalk-config
  namespace: vol-agent-system
  labels:
    app.kubernetes.io/name: agent-server-dingtalk
    app.kubernetes.io/part-of: vol-agent
data:
  agent-server.toml: '[server]

    host = "0.0.0.0"

    port = 3001


    [server.roles]

    control_plane = false

    data_plane = true


    [data_plane]

    # Standalone — no control-plane registration

    node_id = "dingtalk"


    [runtime]

    working_dir = "/app"

    store_dir = "/app/data"


    [tracing]

    level = "info"

    format = "json"


    [opentelemetry]

    enabled = true

    endpoint = "http://otel-collector.observability.svc.cluster.local:4317"

    service_name = "agent-server-dingtalk"

    service_namespace = "vol-agent"

    deployment_environment = "production"

    sample_rate = 1.0

    '
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-definitions-dingtalk
  namespace: vol-agent-system
  labels:
    app.kubernetes.io/name: agent-definitions-dingtalk
    app.kubernetes.io/part-of: vol-agent
data:
  general-purpose.md: '---

    name: general-purpose

    type: general-purpose

    description: General-purpose AI assistant for conversation and task help

    max_iterations: 30

    ---


    You are a helpful AI assistant. Answer questions clearly and concisely.

    '
