apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-server-dp
  namespace: vol-agent-system
  labels:
    app.kubernetes.io/name: agent-server-dp
    app.kubernetes.io/part-of: vol-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-server-dp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-server-dp
        app.kubernetes.io/part-of: vol-agent
    spec:
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/arch: arm64
      imagePullSecrets:
        - name: ghcr-bestnathan
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: agent-server
          image: ghcr.io/bestnathan/vol-agent-server:dp-e2d2805
          imagePullPolicy: IfNotPresent
          workingDir: /app
          args:
            - "--config"
            - "/etc/agent-server/agent-server.toml"
          ports:
            - containerPort: 3002
              name: ws
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/agent-server
              readOnly: true
            # Parent dirs (emptyDir) — create directory structure for subPath files
            - name: agent-agents-dir
              mountPath: /app/.agents/agents
            - name: agent-providers-dir
              mountPath: /app/.agents/providers
            - name: agent-skills-dir
              mountPath: /app/.agents/skills
            - name: agent-sandboxes-dir
              mountPath: /app/.agents/sandboxes
            # agent-definitions (7 files) — subPath, no symlink artifacts
            - name: agent-definitions
              mountPath: /app/.agents/agents/ansible.md
              subPath: ansible.md
              readOnly: true
            - name: agent-definitions
              mountPath: /app/.agents/agents/dingtalk.md
              subPath: dingtalk.md
              readOnly: true
            - name: agent-definitions
              mountPath: /app/.agents/agents/explore.md
              subPath: explore.md
              readOnly: true
            - name: agent-definitions
              mountPath: /app/.agents/agents/general-purpose.md
              subPath: general-purpose.md
              readOnly: true
            - name: agent-definitions
              mountPath: /app/.agents/agents/review.md
              subPath: review.md
              readOnly: true
            - name: agent-definitions
              mountPath: /app/.agents/agents/ssh-test.md
              subPath: ssh-test.md
              readOnly: true
            - name: agent-definitions
              mountPath: /app/.agents/agents/task-cli-test.md
              subPath: task-cli-test.md
              readOnly: true
            # agent-providers (1 file)
            - name: agent-providers
              mountPath: /app/.agents/providers/anthropic-dashscope.toml
              subPath: anthropic-dashscope.toml
              readOnly: true
            # agent-skills (1 file)
            - name: agent-skills
              mountPath: /app/.agents/skills/clarifying-requirements/SKILL.md
              subPath: clarifying-requirements.SKILL.md
              readOnly: true
            # agent-sandboxes (3 files)
            - name: agent-sandboxes
              mountPath: /app/.agents/sandboxes/ansible-prod.toml
              subPath: ansible-prod.toml
              readOnly: true
            - name: agent-sandboxes
              mountPath: /app/.agents/sandboxes/local-for-cli.toml
              subPath: local-for-cli.toml
              readOnly: true
            - name: agent-sandboxes
              mountPath: /app/.agents/sandboxes/ssh-dev.toml
              subPath: ssh-dev.toml
              readOnly: true
            - name: mcp-config
              mountPath: /app/.mcp.json
              subPath: mcp.json
              readOnly: true
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
          env:
            - name: OTEL_SERVICE_NAME
              value: "agent-server-dp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-provider-secrets
                  key: ANTHROPIC_AUTH_TOKEN
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-provider-secrets
                  key: OPENAI_API_KEY
            - name: HTTPS_PROXY
              value: "http://192.168.2.98:8890"
            - name: HTTP_PROXY
              value: "http://192.168.2.98:8890"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,192.168.0.0/16,10.0.0.0/8,kubernetes.default.svc,.svc.cluster.local"
            - name: RUST_LOG
              value: "info"
      volumes:
        - name: config
          configMap:
            name: agent-server-data-plane-config
            items:
              - key: agent-server.toml
                path: agent-server.toml
            defaultMode: 0644
        # EmptyDirs to create parent directories for subPath mounts
        - name: agent-agents-dir
          emptyDir: {}
        - name: agent-providers-dir
          emptyDir: {}
        - name: agent-skills-dir
          emptyDir: {}
        - name: agent-sandboxes-dir
          emptyDir: {}
        # ConfigMaps — mounted via subPath as individual files
        - name: agent-definitions
          configMap:
            name: agent-definitions
            defaultMode: 0644
        - name: agent-providers
          configMap:
            name: agent-providers
            defaultMode: 0644
        - name: agent-skills
          configMap:
            name: agent-skills
            items:
              - key: clarifying-requirements.SKILL.md
                path: clarifying-requirements/SKILL.md
            defaultMode: 0644
        - name: agent-sandboxes
          configMap:
            name: agent-sandboxes
            defaultMode: 0644
        - name: mcp-config
          configMap:
            name: mcp-config
            defaultMode: 0644
        - name: data
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
