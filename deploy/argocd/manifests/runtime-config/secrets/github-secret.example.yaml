---
# GitHub token for the `gh` CLI tool (used by cli-tools-mcp's local sandbox).
# Create the real secret in the cluster before deploying cli-tools-mcp.
# Excluded from ArgoCD sync.
apiVersion: v1
kind: Secret
metadata:
  name: agent-github-secret
  namespace: vol-agent-system
  labels:
    app.kubernetes.io/name: agent-github-secret
    app.kubernetes.io/part-of: vol-agent
    app.kubernetes.io/component: runtime-config
type: Opaque
stringData:
  GITHUB_TOKEN: "ghp_placeholder-replace-me"
